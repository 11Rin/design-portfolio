<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Портфолио</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="portfolio-game">
        <div id="game-grid" class="game-grid"></div>
    </div>
    <div class="portfolio-modal-overlay" id="portfolioModal" aria-hidden="true">
        <div class="portfolio-modal" role="dialog" aria-modal="true">
            <button class="modal-close" id="modalClose" aria-label="Закрыть">&times;</button>
            <div class="modal-label">Задача</div>
            <h2 class="modal-title" id="modalTitle"></h2>
            <p class="modal-task" id="modalTask"></p>
            <button class="modal-answer-btn" id="modalAnswerBtn">Решение &rarr;</button>
        </div>
    </div>
    <script src="script.js"></script>
</body>
</html>
